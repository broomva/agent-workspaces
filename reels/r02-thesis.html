function terminal(t, a) {

function chat(t, a) {

  T(t >= B.findings + 1 ? 'chat history' : 'chat', CH.x + 24, CH.y + 34, { s: 21, w: 600, c: past > .5 ? C.t3 : C.t1 });
  ctx.globalAlpha = a;

// the gaps in what the agent knows: coral question marks that become lookups when it can read the tree
const GAPS = [[-118, -36], [112, -62], [104, 58]];
function gaps(t) {
  const ctx = getCtx();
  GAPS.forEach(([dx, dy], i) => {
    const kin = ramp(t, B.gaps[i] - .1, .35), res = ramp(t, B.lookup + i * .14, .5); if (kin <= .01) return;
    const x = A[0] + dx, y = A[1] + dy + Math.sin(t * 2 + i) * 4;
    if (res < 1) { ctx.globalAlpha = kin * (1 - res); T('?', x, y, { s: 40, w: 600, al: 'center', c: C.coral, f: FONT.s }); glow(x, y, 40, C.coral, .35 * kin * (1 - res)) }
    const fly = clamp((t - B.lookup - i * .14) / .55, 0, 1);         // a read leaves a file row and fills the gap
    if (fly > 0 && fly < 1) { const [rx, ry] = row([0, 1, 3][i]), e = 1 - Math.pow(1 - fly, 3); ctx.globalAlpha = 1; dot(lerp(rx + 200, x, e), lerp(ry, y, e), 4, C.blue, 4) }

}

const H0 = 'A filesystem<br><em>and a shell.</em>', H1 = 'Claims meet<br><em>evidence.</em>', H2 = 'Chat history,<br><em>or a record?</em>';
const SWAPS = [[B.meet - .2, H0, H1], [B.findings - .5, H1, H2]];
const h = document.getElementById('h'), seg = document.getElementById('seg'), thumb = document.getElementById('thumb');
const segs = [...seg.querySelectorAll('span')];

// An element at rest carries no filter, transform or opacity: a leftover blur(0px) composites differently
// depending on the frames rendered before it, so a settled frame must be plain (reel 01).
function settle(el, k, transform, blur) {
  if (k >= 1) { el.style.opacity = ''; el.style.filter = ''; el.style.transform = ''; return }
  el.style.opacity = k; el.style.filter = k > 0 ? `blur(${(1 - k) * blur}px)` : ''; el.style.transform = transform(k);
}

// ── Caption with Intention: word-level CWI from OpenCaptions, rendered as a pure function of t ──
const REEL = JSON.parse(document.getElementById('reel-data').textContent), CAPCFG = REEL.captions;
const capEl = document.getElementById('cap');
// FCC: at most 42 characters per caption; split long events at word boundaries, preferring punctuation.
const FUNC = /^(a|an|the|of|to|in|on|and|or|but|for|with|by|its|it|is|be|can|that)$/i;
function chunkEvents(doc) {
  const out = [];
  for (const e of doc.captions) {
    let cur = [];
    const len = ws => ws.map(w => w.text).join(' ').length;
    for (const w of e.words) {
      if (cur.length && len([...cur, w]) > CAPCFG.maxEventChars) {
        let cut = cur.length;                                   // break after the last punctuation if it is not too early
        for (let i = cur.length - 1; i >= Math.ceil(cur.length / 2); i--) if (/[.,;:?!]$/.test(cur[i].text)) { cut = i + 1; break }
        while (cut > 1 && FUNC.test(cur[cut - 1].text)) cut--;  // never end a caption on "the", "a", "of", "and" …
        out.push({ speaker: e.speaker_id, words: cur.slice(0, cut) }); cur = cur.slice(cut);
      }
      cur.push(w);
    }
    if (cur.length) out.push({ speaker: e.speaker_id, words: cur });
  }
  out.forEach((ev, i) => { ev.start = ev.words[0].start; ev.until = i + 1 < out.length ? out[i + 1].words[0].start : ev.words.at(-1).end + .6 });
  // back-to-back captions share one card: the text swaps, the card does not fade out and in (no blank frame)
  out.forEach((ev, i) => { ev.chainOut = i + 1 < out.length && out[i + 1].start - ev.words.at(-1).end < .5; ev.chainIn = i > 0 && out[i - 1].chainOut });
  return out;
}
const CAPS = window.CWI && !new URLSearchParams(location.search).has('captions') ? chunkEvents(window.CWI) : [];
const spk = id => CAPCFG.speakerColor?.[id] || window.CWI?.cast.find(c => c.id === id)?.color || '#fff';
let capShown = -1;
function captions(t) {
  if (!CAPS.length) { capEl.style.display = 'none'; return }
  let i = -1; for (let k = 0; k < CAPS.length; k++) if (t >= CAPS[k].start - .12) i = k;
  const ev = CAPS[i];
  if (!ev || t > ev.until) { capEl.style.opacity = '0'; capShown = -1; return }
  if (capShown !== i) {                                         // rebuild only when the event changes; style is set from t below
    capEl.innerHTML = ev.words.map(w => `<span class="w${w.emphasis ? ' em' : ''}">${w.text.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`).join(' ');
    capShown = i;
    ev.words.forEach((w, j) => {                               // measure at the word's own weight and size, then reserve the overhang

    el.style.transform = bump > 0 ? `scale(${(1 + .15 * bump).toFixed(4)})` : rise >= 1 ? '' : `translateY(${((1 - rise) * 10).toFixed(2)}px)`;

window.renderAt = function (t) {
  document.documentElement.style.setProperty('--ua', ((t * 40) % 360).toFixed(1) + 'deg');
  captions(t);
  background(t);
  setCtx(cvc); cvc.clearRect(0, 0, 1080, 1920);
  const ctx = cvc, m = ramp(t, B.fs - .1, .9);                       // chat only → filesystem + shell, on "filesystem"
  const away = ramp(t, B.ends, .7), ra = m * (1 - away);              // the session's own wiring goes when it ends
  const tA = ramp(t, B.shell - .15, .6) * (1 - .62 * away + .62 * ramp(t, CMDS[5].at - .3, .4));

  // wiring between the agent and its workspace: reads, answers, bash, the write-back (deck "thesis" ribbons)
  const readP = vc([WS.x + WS.w * .55, WS.y + WS.h], [A[0] - 46, A[1] - 6]);
  const ansP = vc([A[0] + 46, A[1] - 6], [CH.x + CH.w * .45, CH.y + CH.h]);
  const outP = vc([A[0] - 14, A[1] + 46], [A[0] - 14, TM.y]), backP = vc([A[0] + 14, TM.y], [A[0] + 14, A[1] + 46]);

  chat(t, 1);
  gaps(t);

  const evA = 1 - ramp(t, B.ends - .4, .6);
  link(hc([SLOT(1).x, SLOT(1).y + 29], [row(1)[0] + 222, row(1)[1]]), t, B.pointFile, .55, C.green, evA);
  link(vc([SLOT(2).x + SLOT(2).w / 2, SLOT(2).y + SLOT(2).h], [TM.x + 200, TM.y + 90]), t, B.pointTest, .55, C.green, evA);

  // the agent: present for the session, gone when it ends; then the next agent arrives and reads the record
  const pos1 = u => { if (u > B.ends + 1) return null; const o = clamp((u - B.ends) / 1, 0, 1); return [lerp(A[0], A[0] + 460, o * o), lerp(A[1], A[1] - 420, o * o)] };
  if (t < B.ends + 1) travel(pos1, t, C.blue, 1 - ramp(t, B.ends, 1));
  const s2 = B.next - .6, pos2 = u => { if (u < s2) return null; const k = 1 - Math.pow(1 - clamp((u - s2) / .85, 0, 1), 3); return [lerp(A[0] - 560, A[0], k), lerp(A[1] - 200, A[1], k)] };
  if (t >= s2) travel(pos2, t, C.violet, ramp(t, s2, .3));
  const lab = Math.max(1 - away, ramp(t, s2 + .6, .4));
  T(t >= s2 ? 'next agent' : 'agent', A[0] + 58, A[1] + 1, { s: 19, w: 600, c: t >= s2 ? C.violet : C.t2, a: lab });
  const findP = bend([WS.x + WS.w - 62, row(REC)[1] + 19], [A[0] - 40, A[1] - 20], -.18);
  link(findP, t, B.find, .45, C.gold, 1, 2.2);
  ctx.globalAlpha = ramp(t, B.find + .45, .3); flow(t, 5, .6, 5, B.find + .4, u => { const [x, y] = bz(findP, u); dot(x, y, 2.6, C.gold, 4) }); ctx.globalAlpha = 1;

  const w0 = segs[0].offsetWidth, w1 = segs[1].offsetWidth;

  segs[0].classList.toggle('on', m < .5); segs[1].classList.toggle('on', m >= .5);
  let html = H0, vis = 1, dir = 1;
  for (const [at, a, b] of SWAPS) { const sw = ramp(t, at, .7); if (sw <= 0) break; html = sw < .5 ? a : b; vis = sw < .5 ? 1 - sw * 2 : (sw - .5) * 2; dir = sw < .5 ? -1 : 1 }
  if (h.innerHTML !== html) h.innerHTML = html;
  settle(h, vis, k => `translateY(${(1 - k) * 16 * dir}px)`, 10);
  const sOut = ramp(t, B.meet, .6); seg.style.opacity = sOut <= 0 ? '' : String(1 - sOut);
};

const Q = new URLSearchParams(location.search);
FONTS_READY.then(() => Promise.all([100, 200, 300, 400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 54px "Roboto Flex"`)))).then(() => document.fonts.ready).then(() => {
  window.renderAt(+(Q.get('t') || 0));
  window.__ready = true;
  if (!Q.has('t')) {
    const t0 = performance.now();
    const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % (window.SERIES?.total_dur || B.end)); requestAnimationFrame(loop) };
    requestAnimationFrame(loop);
  }
});
