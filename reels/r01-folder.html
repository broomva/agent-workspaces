  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

<script id="reel-data" type="application/json">{

<script>
// Timeline in seconds from the reel start, keyed to the narration's word timings.
const TL = {
  dock0: 0.74, files: 2.32, leave0: 3.0,
  layers: [5.0, 5.94, 6.7, 7.46, 8.18], layersOut: 9.6,
  loopA: 10.6, loopAEvery: 1.6, loopAN: 5,
  flip: 18.76, lit: { 0: 20.24, 3: 21.34, 4: 22.86 },
  loopB: 23.4, loopBEvery: 1.05, loopBN: 15,
  pulse: 29.86, swap: 32.1, chips: [37.0, 38.48, 39.62], end: 40.96
};
const O = [540, 880];                                   // stage centre on the contract's safe-zone centre line
const RINGS = [['PRIMER', 92], ['POLICY', 136], ['SKILLS', 180], ['MEMORY', 224], ['RECORD', 268]];
const R_MEM = RINGS[3][1], R_REC = RINGS[4][1];
const ease = x => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 };
const ramp = (t, a, d) => ease((t - a) / d);
const bgc = document.getElementById('bg').getContext('2d'), cvc = document.getElementById('cv').getContext('2d');
const amb = [...document.querySelectorAll('.ambient i')];

// background: the deck's liquid-metal ASCII flow, a little denser for a phone screen
function background(t) {
  setCtx(bgc); bgc.clearRect(0, 0, 1080, 1920);
  const A = atlas(13, 'oklch(0.78 0.06 245)'); bgc.globalAlpha = .2;
  asciiField(0, 0, 1080, 1920, 17, A, (X, Y) => {
    const f = Math.sin(X * .011 + Math.sin(Y * .008 + t * .19) * 1.7 + t * .13) * .5 + .5,
      g = Math.sin(Y * .015 - t * .11 + Math.sin(X * .005 + t * .07) * 2.2) * .5 + .5;
    return Math.min(.72, Math.pow(f * g, 2.2) * 1.25);
  });
  bgc.globalAlpha = 1;
  amb.forEach((el, i) => el.style.transform = `translate(${Math.sin(t * .05 + i * 2) * 60}px,${Math.cos(t * .04 + i) * 80}px) scale(${1 + .05 * Math.sin(t * .07 + i)})`);
}

// ring label: centred at 12 o'clock on its own ring, on a small Midnight chip so the ring line never runs through it
function ringLabel(s, R, c, a = 1) {
  if (a <= .01) return;
  const ctx = getCtx(), x = O[0], y = O[1] - R; ctx.font = `600 17px ${FONT.m}`; ctx.letterSpacing = '2px';
  const w = ctx.measureText(s).width + 18; ctx.globalAlpha = a * .92; ctx.fillStyle = 'oklch(0.17 0.03 250)';
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - 13, w, 26, 13); ctx.fill();
  ctx.globalAlpha = a; ctx.fillStyle = c; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x + 1, y + 1);
  ctx.letterSpacing = '0px'; ctx.globalAlpha = 1;
}

function folder(t, a) {
  if (a <= .01) return;
  const ctx = getCtx(); ctx.save(); ctx.globalAlpha = a; ctx.translate(O[0], O[1]); ctx.scale(2.1, 2.1);
  const x = -60, y = -44; ctx.strokeStyle = C.t2; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x, y + 88); ctx.lineTo(x + 120, y + 88); ctx.lineTo(x + 120, y + 12); ctx.lineTo(x + 56, y + 12); ctx.lineTo(x + 46, y); ctx.lineTo(x + 4, y); ctx.closePath(); ctx.stroke();
  for (let k = 0; k < 3; k++) {                         // the files the first agent puts there
    const f = ramp(t, TL.files + k * .16, .4); if (f <= 0) continue;
    ctx.globalAlpha = a * f * .8; ctx.fillStyle = C.t3; ctx.fillRect(x + 18, y + 34 + k * 16 - (1 - f) * 14, 70 - k * 14, 3);
  }
  ctx.restore();
  ctx.globalAlpha = a; ctx.font = `500 22px ${FONT.m}`; ctx.fillStyle = C.t2; ctx.textAlign = 'center'; ctx.fillText('project/', O[0], O[1] + 140); ctx.globalAlpha = 1;
}

// an orb with a fading ASCII glyph trail along its recent path
function travel(pos, t, s, c, a) {
  const ctx = getCtx(), A = atlas(16, c);
  for (let k = 8; k >= 1; k--) {
    const p = pos(t - k * .045); if (!p) continue;
    ctx.globalAlpha = a * (1 - k / 9) * .7; glyph(A, Math.max(1, 9 - k), p[0] - 5, p[1] - 10);
  }
  ctx.globalAlpha = 1; const p = pos(t); if (p) orb(p[0], p[1], 34, c, t * 1.6, a);
}

// beat 0: one agent session in a bare folder; its context evaporates when it leaves
const DOCK = [O[0], O[1] + 6];                          // inside the folder
function sessionA(t, s, work = .9) {
  const posA = u => {
    if (u < s || u > s + 1 + work + .9) return null;
    const inP = clamp((u - s) / 1, 0, 1), outP = clamp((u - s - 1 - work) / .9, 0, 1);
    if (outP > 0) return [lerp(DOCK[0], DOCK[0] + 520, outP * outP), lerp(DOCK[1], DOCK[1] - 420, outP * outP)];
    const k = 1 - Math.pow(1 - inP, 3);
    return [lerp(DOCK[0] - 560, DOCK[0], k), lerp(DOCK[1] - 300, DOCK[1], k)];
  };
  const out = clamp((t - s - 1 - work) / .9, 0, 1);
  if (t >= s && out < 1) travel(posA, t, s, C.violet, 1 - out);
  const p = DOCK;                                        // context gathers around the folder, then fragments
  if (t < s + .9 || t > s + 1 + work + 1.2) return;
  const build = clamp((t - s - 1) / work, 0, 1), boom = clamp((t - s - 1 - work) / 1.2, 0, 1);
  reseed(Math.round(s * 977));
  const ctx = getCtx();
  for (let i = 0; i < 22; i++) {
    const a0 = rnd(TAU), r = rnd(150, 200), sp = rnd(.25, .5);
    if (i / 22 > build) continue;
    const ang = a0 + t * sp, rr = r + boom * rnd(60, 160);
    ctx.globalAlpha = (1 - boom); dot(p[0] + Math.cos(ang) * rr, p[1] + Math.sin(ang) * rr + boom * 40, 2, C.violet, 2.5);
  }
  ctx.globalAlpha = 1;
}

// beat 1: the folder becomes a workspace of liquid-metal rings; sessions dock and leave deposits
function rings(t) {
  const k0 = ramp(t, TL.flip, 1.3); if (k0 <= .01) return;
  const ctx = getCtx(), swell = t > TL.pulse ? .8 * Math.max(0, 1 - (t - TL.pulse) / 2.4) : 0;
  RINGS.forEach(([n, r], i) => {
    const k = ramp(t, TL.flip + .2 + i * .14, .9), R = r * (.55 + .45 * k); if (k <= .01) return;
    const lit = TL.lit[i] !== undefined && t >= TL.lit[i] && t < TL.lit[i] + 1.8;
    ctx.globalAlpha = 1;
    if (i === 3) { ctx.strokeStyle = al(C.green, .55 * k); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(O[0], O[1], R, 0, TAU); ctx.stroke() }
    else if (i === 4) { ctx.strokeStyle = al(C.t3, .5 * k); ctx.lineWidth = 1.2; ctx.setLineDash([2, 7]); ctx.beginPath(); ctx.arc(O[0], O[1], R, 0, TAU); ctx.stroke(); ctx.setLineDash([]) }
    metalRing(O[0], O[1], R, t + i * .9, lit ? 2.6 : 1.7, k * (lit ? 1 : .55 + swell * .4), R, .9 + i * .12);
    ringLabel(n, R, i === 3 ? C.green : lit ? C.blue : C.t2, k);
  });
  glow(O[0], O[1], 150 + swell * 80, C.act, .35 * k0);
  orb(O[0], O[1], 46 + swell * 18, C.act, t * 1.2, k0);
}
const GOLD = 2.39996;
function sessionB(t, j) {
  const s = TL.loopB + j * TL.loopBEvery, ang = -1.9 + ((j * GOLD) % 2.7), dock = 62;
  const posB = u => {
    if (u < s || u > s + 2.3) return null;
    const inP = clamp((u - s) / .9, 0, 1), outP = clamp((u - s - 1.4) / .9, 0, 1);
    const r = outP > 0 ? lerp(dock, 720, outP * outP) : lerp(720, dock, 1 - Math.pow(1 - inP, 3));
    return [O[0] + Math.cos(ang) * r, O[1] + Math.sin(ang) * r];
  };
  const out = clamp((t - s - 1.4) / .9, 0, 1);
  if (t >= s && out < 1) travel(posB, t, s, C.act, 1 - out);
  return { launch: s + 1.0, at: s + 1.5, ang };
}
function deposits(t, list) {
  const ctx = getCtx(); let n = 0;
  for (const d of list) {
    const fly = clamp((t - d.launch) / (d.at - d.launch), 0, 1);  // the deposit leaves the core and travels to MEMORY
    if (fly > 0 && fly < 1) {
      const e = 1 - Math.pow(1 - fly, 3), r = lerp(62, R_MEM, e), a = d.ang + Math.PI * .02 + t * .02;
      dot(O[0] + Math.cos(a) * r, O[1] + Math.sin(a) * r, 3.2, C.green, 4);
    }
    const k = clamp((t - d.at) / .5, 0, 1); if (k <= 0) continue; n++;
    const a = d.ang + Math.PI * .02 + t * .02, pulse = t > TL.pulse && t < TL.pulse + 2 ? 1 + .8 * Math.max(0, Math.sin((t - TL.pulse) * 5)) : 1;
    dot(O[0] + Math.cos(a) * R_MEM, O[1] + Math.sin(a) * R_MEM, 3 * pulse, C.green, 3.5 * k);
    ctx.strokeStyle = al(C.t2, .8 * k); ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(O[0], O[1], R_REC, d.ang, d.ang + .035); ctx.stroke();
    if (k < 1) glow(O[0] + Math.cos(a) * R_MEM, O[1] + Math.sin(a) * R_MEM, 40, C.green, .5 * (1 - k));
  }
  return n;
}

const H0 = 'A folder is not<br><em>a workspace.</em>', H1 = 'Value is<br><em>continuity.</em>';
const h = document.getElementById('h'), seg = document.getElementById('seg'), thumb = document.getElementById('thumb');
const segs = [...seg.querySelectorAll('span')], chips = [...document.querySelectorAll('.chip')];
const cS = document.getElementById('cS'), cR = document.getElementById('cR'), pad = n => String(n).padStart(3, '0');

// An element at rest carries no filter, transform or opacity: a leftover blur(0px) composites differently
// depending on the frames rendered before it (motion-lab --verify-all, 1-level diffs), so a settled frame must be plain.
function settle(el, k, transform, blur) {
  if (k >= 1) { el.style.opacity = ''; el.style.filter = ''; el.style.transform = ''; return }
  el.style.opacity = k; el.style.filter = k > 0 ? `blur(${(1 - k) * blur}px)` : ''; el.style.transform = transform(k);
}


// ── Caption with Intention: word-level CWI from OpenCaptions, rendered as a pure function of t ──
const REEL = JSON.parse(document.getElementById('reel-data').textContent), CAPCFG = REEL.captions;
const capEl = document.getElementById('cap');
// FCC: at most 42 characters per caption; split long events at word boundaries, preferring punctuation.
const FUNC = /^(a|an|the|of|to|in|on|and|or|but|for|with|by|its|it|is|be|can|that)$/i;
function chunkEvents(doc) {
  const out = [];
  for (const e of doc.captions) {
    let cur = [];
    const len = ws => ws.map(w => w.text).join(' ').length;
    for (const w of e.words) {
      if (cur.length && len([...cur, w]) > CAPCFG.maxEventChars) {
        let cut = cur.length;                                   // break after the last punctuation if it is not too early
